name: Verificar conexión con Instagram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probar el token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python -m posteo verificar
