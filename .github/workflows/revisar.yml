name: Procesar revisión

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: posteo
  cancel-in-progress: false

jobs:
  revisar:
    # Solo respuestas del dueño o colaboradores en una revisión de posts.
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'revision') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aplicar cambios y publicar lo aprobado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python -m posteo revisar
